{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <h2>Sign Up</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'account_login' %}">Login</a>
    </p>
</div>
{% endblock %}
