{% load static %}
{% load socialaccount %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Join ProjectHub</title>

    <link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
</head>

<body>

<div class="container">

    <div class="auth-box">

        <div class="logo-area">
            <h2>Welcome to ProjectHub</h2>

            <p class="subtitle">
                Connect your GitHub account to access the project management dashboard.
            </p>
        </div>

        <!-- GitHub OAuth Login -->
        <a href="{% provider_login_url 'github' %}" class="github-btn">

            <img 
                src="{% static 'core/img/github-icon.svg' %}" 
                alt="GitHub Logo"
                class="btn-icon"
            >

            <span>Continue with GitHub</span>

        </a>

        <div class="divider">
            <span>Secure OAuth Authentication</span>
        </div>

        <div class="footer-note">

            <p>
                New to coding?
                <a 
                    href="https://github.com/join"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Create a GitHub account
                </a>
                first.
            </p>

        </div>

    </div>

</div>

</body>
</html>
