{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-box">
    <h2>Password Reset Sent</h2>
    <p>If an account exists with the email you entered, you’ll receive a password reset link shortly.</p>

    <p class="switch">
      <a href="{% url 'account_login' %}">Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
