{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10">
    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        No account?
        <a href="{% url 'account_signup' %}">Sign up</a>
    </p>
</div>
{% endblock %}
