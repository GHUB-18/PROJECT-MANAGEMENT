{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<style>
  /* Canvas Setup Wrapper */
  .auth-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
    padding: 1.5rem;
    box-sizing: border-box;
  }

  /* White Card Box with subtle purple-tinted depth shadow */
  .auth-card {
    background: #ffffff;
    padding: 2.75rem 2.25rem;
    border-radius: 16px;
    box-shadow: 0 10px 25px rgba(124, 58, 237, 0.05), 0 4px 12px rgba(0, 0, 0, 0.03);
    border: 1px solid #f3e8ff;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-sizing: border-box;
  }

  /* Success Graphic Icon Emblem */
  .success-emblem {
    width: 56px;
    height: 56px;
    background-color: #f5f3ff;
    color: #7c3aed;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin: 0 auto 1.25rem auto;
  }

  /* Crisp Black Title Header */
  .auth-card h2 {
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 0.75rem 0;
    color: #000000;
    letter-spacing: -0.025em;
    line-height: 1.25;
  }

  /* Clear Body Paragraph Confirmation Description */
  .auth-card p {
    font-size: 0.95rem;
    line-height: 1.6;
    margin: 0 0 2rem 0;
    color: #4b5563;
  }

  /* 🍇 Action Redirect Link styled as a Primary Button block */
  .purple-action-link {
    display: block;
    text-align: center;
    text-decoration: none;
    background-color: #7c3aed;
    color: #ffffff;
    padding: 0.85rem;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    transition: background-color 0.15s ease, transform 0.1s ease;
    box-shadow: 0 4px 14px rgba(124, 58, 237, 0.2);
  }

  .purple-action-link:hover {
    background-color: #6d28d9;
  }

  .purple-action-link:active {
    transform: scale(0.99);
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    
    <div class="success-emblem">🔐</div>
    
    <h2>Password Reset Successful</h2>
    <p>Your security credentials have been updated successfully. You can now log back into your workspace with your new password.</p>

    <a href="{% url 'account_login' %}" class="purple-action-link">
      Return to Login
    </a>
    
  </div>
</div>
{% endblock %}
