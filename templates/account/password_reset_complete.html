{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'core/css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-box">
    <h2>Password Reset Successful</h2>
    <p>Your password has been updated. You can now log in with your new password.</p>

    <p class="switch">
      <a href="{% url 'account_login' %}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
