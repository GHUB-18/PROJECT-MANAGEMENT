<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Project Management</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            background: #f0f2f5; 
        }
        .register-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.1); 
            width: 100%;
            max-width: 400px; 
        }
        h2 { text-align: center; color: #1a1a1a; margin-bottom: 1.5rem; }
        
        /* Styling the Django Form */
        form p { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; }
        input { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 6px; 
            box-sizing: border-box; 
            transition: border-color 0.2s;
        }
        input:focus { border-color: #007bff; outline: none; }
        .helptext { display: block; font-size: 0.8rem; color: #666; margin-top: 4px; }
        
        .btn { 
            width: 100%; 
            padding: 12px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer; 
            margin-top: 10px;
        }
        .btn:hover { background: #0056b3; }
        
        .footer { margin-top: 1.5rem; text-align: center; font-size: 0.95rem; color: #555; }
        .footer a { color: #007bff; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        
        ul.errorlist { color: #dc3545; padding-left: 0; list-style: none; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2>Create Account</h2>
        <form method="post">
            {% csrf_token %}
            
            <p>
                <label for="id_email">Email Address:</label>
                <input type="email" name="email" id="id_email" required placeholder="example@gmail.com">
            </p>

            {{ form.as_p }}
            
            <button type="submit" class="btn">Register</button>
        </form>
        
        <div class="footer">
            Already have an account? <a href="{% url 'login' %}">Login here</a>
        </div>
    </div>
</body>
</html>
