{% extends "base.html" %}

{% block title %}Create New Task{% endblock %}

{% block content %}
<div style="max-width:900px; margin:auto;">
    <div class="card">
        <h2>Create New Task</h2>
        <p style="color:#64748B; margin-bottom: 2rem;">
            Project: <span style="color:#4F46E5; font-weight:600;">{{ project.title }}</span>
        </p>

        <form method="POST" action="{% url 'tasks:create_task' project.id %}">
            {% csrf_token %}

            {% for field in form %}
            <div style="margin-bottom:1.5rem;">
                <label style="display:block; margin-bottom:.5rem; font-weight:600;">
                    {{ field.label }}
                </label>
                {{ field }}

                {% for error in field.errors %}
                    <p style="color:#DC2626; font-size: 0.875rem;">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}

            <div style="display:flex; justify-content:flex-end; gap:1rem; margin-top:2rem; border-top: 1px solid #E2E8F0; pt: 1.5rem;">
                <a href="{% url 'projects:project_detail' project.id %}" class="btn-secondary" style="text-decoration: none; padding: 0.75rem 1rem;">
                    Cancel
                </a>
                <button type="submit" class="btn-primary">
                    Create Task
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
