{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto mt-10">
    <div class="bg-white rounded-2xl shadow-xl border border-gray-200">
        
        <div class="p-6 border-b border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800">Create New Task</h2>
            <p class="text-gray-500">Project: <span class="text-indigo-600 font-medium">{{ project.title }}</span></p>
        </div>

        <form method="POST" action="{% url 'create_task' project.id %}" class="p-6">
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-5">
                <label class="block text-sm font-bold text-gray-700 mb-2">
                    {{ field.label }}
                </label>
                {{ field }}
                
                {% for error in field.errors %}
                    <p class="text-red-500 text-xs mt-1 font-semibold">{{ error }}</p>
                {% endfor %}
            </div>
            {% endfor %}

            <div class="flex items-center justify-end gap-4 pt-4 border-t">
                <a href="{% url 'projects:project_detail' project_id=project_item.id %}" class="text-gray-400 hover:text-gray-600 font-medium">Cancel</a>
                <button type="submit" class="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold hover:bg-indigo-700 shadow-lg transition-all">
                    Create Task
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
