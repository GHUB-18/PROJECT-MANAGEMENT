{% extends 'base.html' %}
{% block content %}
<h2>Your Tasks</h2>
<div class="card mt-3">
    <table class="task-table" style="width: 100%; border-collapse: collapse;">
        <thead>
            <tr style="text-align: left; border-bottom: 2px solid #eee;">
                <th class="p-3">Status</th>
                <th>Task Name</th>
                <th>Project</th>
                <th>Due Date</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks %}
            <tr class="border-bottom">
                <td class="p-3"><span class="badge badge-{{ task.status|lower }}">{{ task.status }}</span></td>
                <td><strong>{{ task.title }}</strong></td>
                <td>{{ task.project.name }}</td>
                <td>{{ task.due_date|date:"M d, Y" }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="4" class="p-4 text-center">No tasks assigned to you.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
