{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 bg-white p-6 rounded-xl shadow">

    <h2 class="text-2xl font-bold mb-6">Create Task</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="bg-indigo-600 text-white px-5 py-2 rounded-lg mt-4">
            Save Task
        </button>
    </form>

</div>
{% endblock %}
