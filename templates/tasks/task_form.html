{% extends "base.html" %}

{% block title %}
{{ title|default:"Task Form" }}
{% endblock %}

{% block content %}

<div style="max-width:900px; margin:auto;">

    <div class="card">

        <h2 style="margin-bottom:2rem;">
            {{ title|default:"Task Details" }}
        </h2>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
            <div style="margin-bottom:1.5rem;">

                <label style="
                    display:block;
                    margin-bottom:.5rem;
                    font-weight:600;
                ">
                    {{ field.label }}
                </label>

                {{ field }}

                {% for error in field.errors %}
                    <p style="color:#DC2626;">
                        {{ error }}
                    </p>
                {% endfor %}
            </div>
            {% endfor %}

            <div style="
                display:flex;
                justify-content:flex-end;
                gap:1rem;
                margin-top:2rem;
            ">
                <button type="submit" class="btn-primary">
                    Save Task
                </button>
            </div>

        </form>

    </div>

</div>

{% endblock %}
